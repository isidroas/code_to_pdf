# name: Code to pdf test
on: push
jobs:
    build-examples:
        runs-on: ubuntu-latest
        # strategy:
        #   matrix:
        #     # python-version: ["3.8", "3.11", "3.12", "3.13"]
        #     python-version: ["3.11"]
        env:
          # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
          MAKEFLAGS: "-j 4"
        steps:
            # - name: Setup Python ${{ matrix.python-version }}
            #   uses: actions/setup-python@v5
            #   with:
            #     python-version: ${{ matrix.python-version }}
            - uses: actions/setup-python@v5
            - uses: actions/checkout@v4
            - uses: actions/cache@v4
              id: cache-id
              with:
                path: /
                key: ${{ runner.os }}-cache-all-key-v1.0
            - name: Install dependencies
              # TODO: find a quicker method. Currently the download is fast but the installation is slow
              # In total, it takes 5min
              if: steps.cache-id.outputs.cache-hit != 'true'
              env:
                CACHE_HIT: ${{steps.cache-id.outputs.cache-hit}}
              run: sudo apt install texlive-full
              # run: |
              #   if [[ "$CACHE_HIT" == 'true' ]]; then
              #     sudo cp --verbose --force --recursive ~/texlive/* /usr/share
              #   else
              #     sudo apt-get install texlive-full
              #     mkdir -p ~/valgrind
              #     sudo cp --parents --target-directory /usr/share/* ~/texlive/
              #   fi
            - name: Install fonts
              run: |
                  ./.github/workflows/install_nerd_fonts.sh
            - name: Install package
              run: python -m pip install  ./
            - name: Build
              working-directory: ./examples
              env:
                REPO2TEX_FLAGS: --monofont "SauceCodePro Nerd Font Mono" --mainfont "SauceCodePro Nerd Font"
              run: make clean && make all
            - name: Archive PDFs
              uses: actions/upload-artifact@v4
              with:
                name: pdf
                path: |
                  examples/*.pdf
                  examples/*.tex
                  examples/*.tar.gz
            - name: Build with default fonts
              working-directory: ./examples
              run: make clean && make all
            - name: Build with pdflatex
              working-directory: ./examples
              env:
                TEX2PDF: pdflatex
              run: make clean && make all
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v5
            - uses: actions/checkout@v4
            - name: Pre-commit
              run: |
                   pip install pre-commit
                   pre-commit install --install-hooks
                   pre-commit run --all-files
